<!DOCTYPE html>
<html>
<head>
	<base target="_top">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<style>:root{--bg-color:#36393f;--card-bg:#2f3136;--text-main:#dcddde;--text-muted:#8e9297;--discord-embed:#202225}body{font-family:'Inter',sans-serif;background-color:var(--bg-color);color:var(--text-main);margin:0;padding:20px}.header{text-align:center;margin-bottom:20px}.header h1{margin:0;font-size:24px;color:#fff}.header p{margin:5px 0 0;color:var(--text-muted);font-size:14px}.global-reset-box{max-width:900px;margin:16px auto 0;background:var(--card-bg);border-radius:8px;padding:16px 20px;box-shadow:0 4px 6px rgba(0,0,0,.1);text-align:left}.global-reset-header{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px}.global-reset-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;font-family:monospace;font-size:13px;color:#a3a6aa;text-align:center}@media(max-width:768px){.global-reset-grid{grid-template-columns:repeat(1,1fr)}}#dashboard-grid{display:grid;gap:15px}.card{background:var(--card-bg);border-radius:8px;border-left:4px solid var(--discord-embed);padding:16px;box-shadow:0 4px 6px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:12px}.card.success{border-left-color:#43b581}.card.error{border-left-color:#f04747}.card-header{font-weight:700;font-size:18px;color:#fff;display:flex;align-items:center;gap:10px}.avatar-img{width:32px;height:32px;border-radius:6px;object-fit:cover;background:#202225}.section-title{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}.content-box{font-size:14px;line-height:1.6;background:var(--bg-color);padding:8px 12px;border-radius:4px}.stats-box{font-size:13px;font-family:monospace;color:#a3a6aa;white-space:nowrap}.live-time,.live-energy{color:#fff}.live-time,.energy-hover,.time-ago-hover,.uid-hover{cursor:pointer}.inline-icon{width:20px;height:20px;border-radius:4px;vertical-align:middle;margin-right:6px;margin-bottom:3px}.loader{text-align:center;color:var(--text-muted);padding:50px}#custom-tooltip{position:fixed;background:#18191c;color:#dcddde;padding:6px 12px;border-radius:4px;font-size:13px;font-weight:600;pointer-events:none;z-index:9999;opacity:0;visibility:hidden;box-shadow:0 4px 8px rgba(0,0,0,.3);max-width:90vw;white-space:normal;word-break:break-word;transition:opacity .1s ease}#custom-tooltip.show{opacity:1;visibility:visible}</style>
</head>
<body>
	<div class="header"><h1>📝 Endfield - Report Dashboard</h1><p id="last-update">Loading...</p><div id="global-reset" class="global-reset-box" style="display:none"></div></div>
	<div id="dashboard-grid"><div class="loader">Fetching data from server...</div></div>
	<div id="custom-tooltip"></div>
	<script>
		let tmr, tt, aH = null, U = {
			tz: undefined,
			shn: (n, d=2, f=!1) => { let u=0, x=+n, a=["","k","m","b","t","qa","qi","sx","sp","oc","no","dc"]; while(x>=1e3&&u<a.length-1){x/=1e3;u++;} return (f?x.toFixed(d):(Number.isInteger(x)?x.toString():x.toFixed(d).replace(/\.?0+$/,"")))+a[u]; },
			fmt: (ts, b=!1) => { if(b) return `<t:${ts}:R>`; let d=(((ts>1e11?ts/1e3:ts)-Date.now()/1e3)|0), a=Math.abs(d), f=(n,u)=>d>0?`in ${n} ${u}${n>1?"s":""}`:`${n} ${u}${n>1?"s":""} ago`; return a<60?f(a,"sec"):a<3600?f((a/60)|0,"min"):a<864e2?f((a/3600)|0,"hour"):a<6048e2?f((a/864e2)|0,"day"):a<2592e3?f((a/6048e2)|0,"week"):a<31536e3?f((a/2592e3)|0,"month"):f((a/31536e3)|0,"year"); },
			fCD: d => `${Math.floor(d/60).toString().padStart(2,'0')}:${Math.floor(d%60).toString().padStart(2,'0')}`
		}, gE = (mTs, sEn, mE=360, rS=432) => { let nS=(Date.now()/1000)|0, r=Math.max(0,mTs-nS); if(!r) return {e:mE, r:0, nTs:nS}; let cE=Math.min(mE,Math.max(0,mE-Math.ceil(r/rS))), nES=r%rS||rS; return {e:cE, r:nES, nTs:nS+nES}; };

		window.onload = () => {
			let g = document.getElementById('dashboard-grid'); tt = document.getElementById('custom-tooltip');
			g.style.gridTemplateColumns = window.innerWidth>768 ? 'repeat(3, 1fr)' : 'repeat(auto-fit, minmax(min(100%, 300px), 1fr))';
			document.onmouseover = e => { let E=e.target.closest('.energy-hover'), T=e.target; if(E?.dataset.ets){ aH=E; tt.innerText=`Next energy: ${U.fCD(+E.dataset.ets)}`; tt.className='show'; } else if(T.classList.contains('live-time')&&T.dataset.full){ tt.innerText=T.dataset.full; tt.className='show'; } else if(T.classList.contains('time-ago-hover')){ tt.innerText=U.fmt(+T.dataset.ts); tt.className='show'; } else if(T.classList.contains('uid-hover')){ aH=T; tt.innerText=`UID: ${T.dataset.uid}`; tt.className='show'; } };
			document.onmousemove = e => { if(tt.className==='show'){ let x=e.clientX+15, y=e.clientY+15, w=window.innerWidth, h=window.innerHeight; tt.style.left=(x+tt.offsetWidth>w?Math.max(5,e.clientX-tt.offsetWidth-10):x)+'px'; tt.style.top=(y+tt.offsetHeight>h?Math.max(5,e.clientY-tt.offsetHeight-10):y)+'px'; } };
			document.onmouseout = e => { let c=e.target.classList; if(c.contains('live-time')||e.target.closest('.energy-hover')||c.contains('time-ago-hover')||c.contains('uid-hover')){ tt.className=''; aH=null; } };
			document.onclick = e => { let T=e.target; if(T.classList.contains('uid-hover')&&T.dataset.uid) navigator.clipboard.writeText(T.dataset.uid).then(()=>{ tt.innerText='UID Copied!'; setTimeout(()=>{ if(aH===T) tt.innerText=`UID: ${T.dataset.uid}`; }, 1500); }); };
			google.script.run.withSuccessHandler(rD).getWebData();
		};

		const uT_fn = () => {
			document.querySelectorAll('.energy-hover').forEach(el => { let mTs=+el.dataset.maxts||0, mE=+el.dataset.me||360, rS=432, {e:cE, r:remSec}=gE(mTs, +el.dataset.ie||0, mE, rS), eE=el.querySelector('.live-energy'), b=el.closest('.stats-box'); if(eE) eE.innerText=cE; if(cE>=mE){ el.removeAttribute('data-ets'); if(aH===el) tt.className=''; } else { el.setAttribute('data-ets',remSec); if(aH===el) tt.innerText=`Next energy: ${U.fCD(remSec)}`; } b && b.querySelectorAll('.energy-milestone').forEach(m => { let t=+m.dataset.target, sp=m.querySelector('.live-time'), ts=(mTs-(mE-t)*rS)*1000; if(cE>=t) m.innerHTML='Fulled'; else sp?sp.setAttribute('data-ts',ts):m.innerHTML=`<span class="live-time" data-ts="${ts}"></span>`; }); });
			document.querySelectorAll('.live-time').forEach(el => { let t=+el.dataset.ts; if(t){ el.innerText=U.fmt(t); if(!el.dataset.full) el.dataset.full=new Date(t).toLocaleString('en-US',{dateStyle:'full',timeStyle:'short',hour12:!0,timeZone:U.tz}); } });
		};

		const rD = d => {
			U.tz = d.tz || Intl.DateTimeFormat().resolvedOptions().timeZone;
			let r=document.getElementById('global-reset'), g=document.getElementById('dashboard-grid'), uT=new Date(d.updatedAt).getTime(), fR=t=>t?`<span class="live-time" data-ts="${t*1e3}"></span>`:'-';
			document.getElementById('last-update').innerHTML = `Last Update: <span class="time-ago-hover" data-ts="${uT}">${new Date(uT).toLocaleString('en-US',{dateStyle:'full',timeStyle:'medium',hour12:!0,timeZone:U.tz})}</span>`;
			if(d.serverReset){ r.style.display='block'; r.innerHTML=`<div class="global-reset-header">Server Reset</div><div class="global-reset-grid"><div>🌸 Daily: ${fR(d.serverReset.daily)}</div><div>📅 Weekly: ${fR(d.serverReset.weekly)}</div><div>🛒 Arsenal: ${fR(d.serverReset.arsenal)}</div><div>🌟 BP: ${fR(d.serverReset.bp)}</div><div>⚔️ EoW: ${fR(d.serverReset.eow)}</div></div>`; } else r.style.display='none';
			if(!d.accounts?.length) return g.innerHTML = '<div class="loader">No data available. Please run the script first.</div>';
			g.innerHTML = d.accounts.map(a => { let c=a.playerCard, bs=c?.base, aU=bs?.avatarUrl, rH=a.itemIcon_url?.length?a.msg.split('\n').map((l,i)=>a.itemIcon_url[i]?l.replace(/🎁\s*/,`<img src="${a.itemIcon_url[i]}" class="inline-icon" referrerpolicy="no-referrer"> `):l).join('<br>'):a.msg.replace(/\n/g,'<br>'), sH=""; if(bs){ let dl=c.domain, dg=c.dungeon, en=+dg.curStamina, em=+dg.maxStamina, mTs=+dg.maxTs, aS=0, aM=0, aStr=""; dl.forEach(x => { let s=x.settlements.filter(y=>+y.level>0), cur=s.reduce((v,y)=>v+(+y.remainMoney),0), max=s.reduce((v,y)=>v+(+y.moneyMax),0), fd=s.filter(y=>+y.remainMoney===+y.moneyMax).length; aS+=cur; aM+=max; let rL=s.map((y,i)=>`&emsp;&emsp;[${i+1}]: ${U.shn(y.remainMoney)}/${U.shn(y.moneyMax)}`).join("<br>"); aStr+=`<br>&emsp;→ ${x.name.trim().split(/\s+/)[0]} [${fd}/${s.length}]: ${s.length&&fd===s.length?'Fulled':(max?((cur/max)*100).toFixed(2):"0.00")+'%'}${rL?`<br>${rL}`:""}`; }); sH=`<div><div class="section-title">Player Stats</div><div class="content-box stats-box">🔑 Login: <span class="live-time" data-ts="${bs.lastLoginTime*1e3}"></span><br>🌸 Daily: ${c.dailyMission.dailyActivation}/${c.dailyMission.maxDailyActivation}<br>📅 Weekly: ${c.weeklyMission.score}/${c.weeklyMission.total}<br>🌟 BP: ${c.bpSystem.curLevel}/${c.bpSystem.maxLevel}<br>⚡️ Energy: <span class="energy-hover" data-ie="${en}" data-me="${em}" data-maxts="${mTs}"><span class="live-energy">${en}</span>/<span style="color:#fff">${em}</span></span><br>${[160,200,240,em].map(v=>`&emsp;→ ${v}: <span class="energy-milestone" data-target="${v}"></span>`).join('<br>')}<br>🏠 AIC Funds: ${aM?((aS/aM)*100).toFixed(2):"0.00"}%${aStr}</div></div>`; } return `<div class="card ${a.success?'success':'error'}"><div class="card-header">${aU?`<img src="${aU}" class="avatar-img" referrerpolicy="no-referrer">`:`<div class="avatar-img" style="display:flex;align-items:center;justify-content:center;font-size:14px">👤</div>`} <span class="uid-hover" data-uid="${a.uid}">${a.nickname} (${a.serverName})</span></div><div><div class="section-title">Status</div><div class="content-box">${a.status}</div></div><div><div class="section-title">Response</div><div class="content-box">${rH}</div></div>${sH}</div>`; }).join('');
			if(tmr) clearInterval(tmr); uT_fn(); tmr = setInterval(uT_fn, 1000);
		};
	</script>
</body>
</html>
